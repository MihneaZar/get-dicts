# These are the default dictionary entries, which also serve as an example.
# For the dictionaries themselves, add them as a list of entries (even if it's only one).
# Add the '{query}' where the search words go (try searching something and see where it is in the link).
# For Chrome command-line arguments, simply add them as '{name}: "{argument}"' 
# Multiple arguments can be typed on the same line, separated by space.
# This is the entire list of Chrome arguments: https://peter.sh/experiments/chromium-command-line-switches/.
# Entries with '_' at the beginning of their name are ignored by the program, so they can be removed without being deleted. 

_example:
    - "This entry will be ignored, because of the '_' at the beginning."

english:
    - "https://www.thesaurus.com/browse/{query}"
    - "https://www.merriam-webster.com/thesaurus/{query}"
    - "https://www.wordhippo.com/what-is/another-word-for/{query}.html"

romanian:
    - "https://dexonline.ro/definitie/{query}"
    - "https://www.dictionardesinonime.ro/?c={query}"

translate:
    - "https://context.reverso.net/traducere/engleza-romana/{query}"

incognito: "-incognito"

new-window: "/new-window"